<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Federal Security Scan</title>

<style>
body {
    margin: 0;
    background: black;
    color: #00ff00;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

#matrix {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

.container {
    text-align: center;
    margin-top: 8%;
}

.logo {
    width: 130px;
    height: 130px;
    border: 3px solid #00ff00;
    border-radius: 50%;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
}

.box {
    border: 2px solid #00ff00;
    padding: 30px;
    width: 65%;
    margin: 30px auto;
}

.progress-bar {
    width: 100%;
    background: #002200;
    border: 1px solid #00ff00;
    height: 25px;
    margin-top: 20px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #00ff00;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">
    <div class="logo">
        F.B.I.<br>
        Federal Browsing Inspector
    </div>

    <div class="box">
        <h2>ESCANEO FORENSE DIGITAL EN PROCESO</h2>
        <p id="browser"></p>
        <p id="status">Iniciando análisis profundo...</p>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <p id="percent">0%</p>
    </div>
</div>

<script>
// MATRIX EFFECT
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = [];

for (let x = 0; x < columns; x++) drops[x] = 1;

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00ff00";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
            drops[i] = 0;

        drops[i]++;
    }
}
setInterval(drawMatrix, 33);


// DETECTAR NAVEGADOR
function detectBrowser() {
    let ua = navigator.userAgent;
    if (ua.indexOf("Chrome") > -1) return "Google Chrome";
    if (ua.indexOf("Safari") > -1 && ua.indexOf("Chrome") === -1) return "Safari";
    if (ua.indexOf("Firefox") > -1) return "Mozilla Firefox";
    if (ua.indexOf("Edg") > -1) return "Microsoft Edge";
    return "Navegador Desconocido";
}

document.getElementById("browser").innerText =
    "Navegador detectado: " + detectBrowser();


// PROGRESO + VIBRACIÓN
let progress = 0;
let progressBar = document.getElementById("progress");
let percentText = document.getElementById("percent");
let statusText = document.getElementById("status");

let interval = setInterval(() => {
    progress++;
    progressBar.style.width = progress + "%";
    percentText.innerText = progress + "%";

    if (progress == 20) {
        statusText.innerText = "Accediendo a modo incógnito...";
        if (navigator.vibrate) navigator.vibrate(200);
    }

    if (progress == 45) {
        statusText.innerText = "Extrayendo historial sospechoso...";
        if (navigator.vibrate) navigator.vibrate([100, 100, 100]);
    }

    if (progress == 70) {
        statusText.innerText = "Enviando reporte a servidor federal...";
        if (navigator.vibrate) navigator.vibrate(400);
    }

    if (progress >= 100) {
        clearInterval(interval);
        statusText.innerHTML = "<br><strong>pico pal que lee</strong> 😂";
        if (navigator.vibrate) navigator.vibrate([300,100,300,100,500]);
    }

}, 50);

</script>

</body>
</html>
