<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Federal Security Scan</title>

<style>
body {
    margin: 0;
    background: black;
    color: #00ff00;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

#matrix {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

.container {
    text-align: center;
    margin-top: 10%;
}

.logo {
    width: 120px;
    height: 120px;
    border: 3px solid #00ff00;
    border-radius: 50%;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
}

.box {
    border: 2px solid #00ff00;
    padding: 30px;
    width: 60%;
    margin: 30px auto;
}

.progress-bar {
    width: 100%;
    background: #003300;
    border: 1px solid #00ff00;
    height: 25px;
    margin-top: 20px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #00ff00;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">
    <div class="logo">
        F.B.I.<br>
        Federal Browsing Inspector
    </div>

    <div class="box" id="scanBox">
        <h2>INICIANDO ESCANEO FORENSE DIGITAL</h2>
        <p id="status">Analizando tráfico de red...</p>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <p id="percent">0%</p>
    </div>
</div>

<script>
// Matrix effect
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;

const drops = [];
for (let x = 0; x < columns; x++)
    drops[x] = 1;

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ff00";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
            drops[i] = 0;

        drops[i]++;
    }
}
setInterval(drawMatrix, 33);

// Progress simulation
let progress = 0;
let progressBar = document.getElementById("progress");
let percentText = document.getElementById("percent");
let statusText = document.getElementById("status");

let interval = setInterval(() => {
    progress++;
    progressBar.style.width = progress + "%";
    percentText.innerText = progress + "%";

    if (progress == 25) statusText.innerText = "Accediendo a historial incógnito...";
    if (progress == 50) statusText.innerText = "Detectando contenido sospechoso...";
    if (progress == 75) statusText.innerText = "Generando reporte federal...";
    
    if (progress >= 100) {
        clearInterval(interval);
        statusText.innerHTML = "<br><strong>pico pal que lee</strong> 😂";
    }

}, 60);
</script>

</body>
</html>
